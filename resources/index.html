<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEU_Club</title>
    <style>
        html, body{
            background-color: #0d0d0f;
        }
        .stage{
            visibility: hidden;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"/>
		<link rel="stylesheet" href="assets/css/loading.fbcaafb3.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="assets/css/loading.fbcaafb3.css"></noscript>
		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
	  <div class="stage">
        <div class="brand">
            <div class="mark">
                <img src="icons/icon128.png" alt="beu club logo"\>
            </div>
            <div class="wordmark" brand-text> BEU Club</div>
        </div>

        <div class="tagline" id="apptagline">Providing platform for college students</div>
        <div class="version" id="versionInfo">beuclub 1.0.0</div>

    </div>
	<!-- Running -->
    <div id="boot-content"></div>
    <div class="terminal">
        <div class="terminal-header">
            <span class="terminal-title">CHANGELOGS</span>
        </div>
        <div class="terminal-body" id="log"></div>
    </div>
	<div class="ring-wrap">
        <div class="ring">
            <svg width="75" height="75" viewBox="0 0 90 90">
                <circle class="circle-track" cx="45" cy="45" r="40"></circle>
                <circle class="ring-fill" id="ringfill" cx="45" cy="45" r="40"></circle>
            </svg>

            <div class="ring-pct" id="pct">0%</div>
        </div>

        <div class="status" id="status">Connecting to server&hellip;
        <a class="launch" id="launchBtn" href="auth.html">Open Dashboard</a>
        <button type="button" class="refresh-btn" hidden id="refreshBtn">
            <svg height="13" width="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"></svg>
        </button>
        </div>
    </div>

	<div id="mainPanel" class="Panel-Info Maintenance hidden">
        <svg class="info-icon" widht="16" height="16" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="22" stroke="var(--warn) stroke-width="2"/></svg>
            <path d="M24 14V26M24 33H24.01" stroke="var(--warn)" stroke-width="2.5" stroke-linecap="round"/>
    </div>

</body>
